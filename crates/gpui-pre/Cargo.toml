    "profiler",
    "dep:criterion",
    "dep:bench_metrics",
]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
font-kit = []
inspector = ["gpui_macros/inspector"]
leak-detection = []
